<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ユーザー編集</title>
</head>
<body>
    <h1>ユーザー編集</h1>

    {% if error %}
        <p style="color: red;">
            {{ error }}
        </p>
    {% endif %}

    <form method="post">
        <div>
            <label for="name">名前</label>
            <input
                type="text"
                id="name"
                name="name"
                value="{{ user['name'] }}"
                required
            >
        </div>

        <div>
            <label for="email">メールアドレス</label>
            <input
                type="email"
                id="email"
                name="email"
                value="{{ user['email'] }}"
                required
            >
        </div>

        <button type="submit">更新する</button>
    </form>

    <p>
        <a href="{{ url_for('index') }}">一覧へ戻る</a>
    </p>
</body>
</html>
