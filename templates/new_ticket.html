{% extends "base.html" %}

{% block title %}
問い合わせ登録 | 問い合わせ管理
{% endblock %}

{% block content %}
<h1>問い合わせ登録</h1>

<p class="page-description">
    発生している事象を入力してください。
</p>

<form method="post" class="ticket-form">
    <div class="form-group">
        <label for="title">
            件名
            <span class="required">必須</span>
        </label>

        <input
            id="title"
            name="title"
            type="text"
            placeholder="例：帳票が印刷できない"
            required
        >
    </div>

    <div class="form-group">
        <label for="category">
            カテゴリ
        </label>

        <select id="category" name="category">
            <option value="システム">
                システム
            </option>

            <option value="プリンター">
                プリンター
            </option>

            <option value="アカウント">
                アカウント
            </option>

            <option value="ネットワーク">
                ネットワーク
            </option>

            <option value="その他">
                その他
            </option>
        </select>
    </div>

    <div class="form-group">
        <label for="priority">
            優先度
        </label>

        <select id="priority" name="priority">
            <option value="低">
                低
            </option>

            <option value="中" selected>
                中
            </option>

            <option value="高">
                高
            </option>
        </select>
    </div>

    <div class="form-group">
        <label for="description">
            問い合わせ内容
            <span class="required">必須</span>
        </label>

        <textarea
            id="description"
            name="description"
            rows="7"
            placeholder="いつ、どの画面で、どのような事象が発生したか入力してください"
            required
        ></textarea>
    </div>

    <div class="form-actions">
        <button class="button" type="submit">
            登録する
        </button>

        <a
            class="cancel-link"
            href="{{ url_for('index') }}"
        >
            キャンセル
        </a>
    </div>
</form>
{% endblock %}
